<script>
'use strict';
const decode = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
const form = document.getElementById('unlock');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const input = document.getElementById('password');
  const button = document.getElementById('submit');
  const error = document.getElementById('error');
  error.textContent = ''; button.disabled = true;
  try {
    const payload = JSON.parse(document.getElementById('payload').textContent);
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:decode(payload.salt), iterations:payload.iterations, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const bytes = await crypto.subtle.decrypt({name:'AES-GCM', iv:decode(payload.iv)}, key, decode(payload.ciphertext));
    const report = new TextDecoder('utf-8', {fatal:true}).decode(bytes);
    input.value = '';
    document.open(); document.write(report); document.close();
  } catch (_) { error.textContent = 'Unable to unlock the report. Check the password and try again.'; button.disabled = false; }
});
</script></body></html>
